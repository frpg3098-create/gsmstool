<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSM FRP - Official Unlock Services</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #060913; --card-bg: rgba(15, 23, 42, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-blue: #00d2ff; --primary: #2563eb;
            --text-main: #f8fafc; --text-dim: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: var(--text-main); }
        
        header {
            position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center;
            padding: 18px 6%; background: rgba(6, 9, 19, 0.85); backdrop-filter: blur(15px); border-bottom: 1px solid var(--card-border);
        }
        .logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .logo-box { width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, #1d4ed8, var(--accent-blue)); display: flex; align-items: center; justify-content: center; font-size: 20px; color: #fff; }
        .logo-title { font-size: 22px; font-weight: 800; color: #fff; }
        nav a { color: var(--text-dim); text-decoration: none; margin-left: 20px; font-weight: 600; font-size: 14px; }
        nav a.active { color: var(--accent-blue); }

        .tabs-bar { display: flex; justify-content: center; gap: 12px; padding: 40px 6% 20px; flex-wrap: wrap; }
        .tab-btn { background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-dim); padding: 12px 26px; border-radius: 30px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .tab-btn.active, .tab-btn:hover { background: var(--primary); color: #fff; border-color: var(--accent-blue); box-shadow: 0 0 20px rgba(37,99,235,0.4); }

        .services-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 20px; padding: 20px 6% 60px; }
        .service-card {
            background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 20px; padding: 26px;
            display: flex; flex-direction: column; justify-content: space-between; transition: 0.3s;
        }
        .service-card:hover { transform: translateY(-6px); border-color: var(--accent-blue); box-shadow: 0 15px 35px rgba(0, 210, 255, 0.1); }
        .price-badge { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.06); padding: 12px; border-radius: 12px; margin: 15px 0; }
        .usd-val { font-size: 22px; font-weight: 800; color: var(--accent-blue); }
        .sar-val { font-size: 14px; color: var(--text-dim); }
        .btn-order { width: 100%; background: linear-gradient(135deg, var(--primary), #1d4ed8); border: none; color: #fff; padding: 12px; border-radius: 12px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .btn-order:hover { box-shadow: 0 0 20px rgba(37,99,235,0.5); }

        /* Modal */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
        .modal-content { background: #0f172a; border: 1px solid var(--accent-blue); border-radius: 24px; padding: 35px; max-width: 500px; width: 100%; position: relative; max-height: 90vh; overflow-y: auto; }
        .close-btn { position: absolute; top: 20px; right: 20px; background: transparent; border: none; color: var(--text-dim); font-size: 22px; cursor: pointer; }
        .input-box { width: 100%; padding: 14px; background: rgba(0,0,0,0.4); border: 1px solid var(--card-border); border-radius: 10px; color: #fff; margin: 10px 0 18px; outline: none; }
        .wallet-box { background: rgba(0,210,255,0.08); border: 1px dashed var(--accent-blue); padding: 12px; border-radius: 10px; font-family: monospace; font-size: 13px; color: var(--accent-blue); word-break: break-all; text-align: center; margin: 10px 0; }

        /* VIP Crypto Payment Card Styles */
        .qr-payment-card {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(0, 210, 255, 0.25);
            border-radius: 20px;
            padding: 25px;
            max-width: 380px;
            margin: 20px auto;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #f8fafc;
        }

        .qr-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 18px;
        }

        .crypto-icon {
            width: 36px;
            height: 36px;
        }

        .qr-header h4 {
            margin: 0;
            font-size: 18px;
            font-weight: 800;
            text-align: left;
        }

        .network-tag {
            font-size: 12px;
            color: #00d2ff;
            display: block;
            text-align: left;
            font-weight: 600;
        }

        .qr-image-wrapper {
            background: #ffffff;
            padding: 12px;
            border-radius: 16px;
            display: inline-block;
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.2);
            margin-bottom: 15px;
        }

        .qr-code-img {
            display: block;
            width: 190px;
            height: 190px;
        }

        .qr-label {
            display: block;
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 6px;
            text-align: left;
        }

        .wallet-box-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 8px 12px;
            margin-bottom: 15px;
            gap: 8px;
        }

        .wallet-box-container span {
            font-family: monospace;
            font-size: 11.5px;
            color: #38bdf8;
            word-break: break-all;
            text-align: left;
        }

        .btn-copy-address {
            background: #2563eb;
            color: #ffffff;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: 0.2s;
            flex-shrink: 0;
        }

        .btn-copy-address:hover {
            background: #1d4ed8;
        }

        .network-alert {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 11.5px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-align: left;
            line-height: 1.4;
        }

        .network-alert i {
            font-size: 16px;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">
            <div class="logo-box"><i class="fa-solid fa-microchip"></i></div>
            <div class="logo-title">GSM FRP</div>
        </a>
        <nav>
            <a href="index.html">Home</a>
            <a href="services.html" class="active">Unlock Services</a>
            <a href="tools.html">Free Forensic Tools</a>
            <a href="track.html">Track Order</a>
        </nav>
    </header>

    <div class="tabs-bar">
        <button class="tab-btn active" onclick="loadCategory('iphone')">iPhone Server Unlock</button>
        <button class="tab-btn" onclick="loadCategory('ipad')">iPad Tablets</button>
        <button class="tab-btn" onclick="loadCategory('watch')">Apple Watch</button>
        <button class="tab-btn" onclick="loadCategory('carrier')">Carrier SIM (Samsung/Global)</button>
    </div>

    <div class="services-grid" id="servicesGrid"></div>

    <!-- VIP Checkout Modal -->
    <div class="modal" id="orderModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
            <h3 id="targetService" style="font-size: 22px; font-weight: 800;">Checkout</h3>
            <p style="color: var(--text-dim); font-size: 14px; margin-bottom: 15px;">Cost: <span id="targetPrice" style="color: var(--accent-blue); font-weight: 700;"></span></p>

            <label style="font-size: 13px; font-weight: 600;">IMEI or Serial Number:</label>
            <input type="text" id="serialInput" class="input-box" placeholder="Enter device IMEI or Serial...">

            <!-- VIP Crypto Payment Card -->
            <div class="qr-payment-card">
                <div class="qr-header">
                    <img src="https://cryptologos.cc/logos/tether-usdt-logo.png" alt="USDT" class="crypto-icon">
                    <div>
                        <h4>USDT (BEP20)</h4>
                        <span class="network-tag">BNB Smart Chain</span>
                    </div>
                </div>

                <!-- باركود الـ QR مولد مباشرة لنفس عنوان محفظتك الجديد -->
                <div class="qr-image-wrapper">
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=0x4366334e0b824187d49E2B15522a9204c5b87216" alt="USDT BEP20 QR Code" class="qr-code-img">
                </div>

                <!-- عنوان المحفظة مع زر النسخ السريع -->
                <label class="qr-label">Receiving Wallet Address:</label>
                <div class="wallet-box-container">
                    <span id="targetWallet">0x4366334e0b824187d49E2B15522a9204c5b87216</span>
                    <button type="button" class="btn-copy-address" onclick="copyWalletAddress()">
                        <i class="fa-regular fa-copy"></i> Copy
                    </button>
                </div>

                <!-- التنبيه الأمني للشبكة -->
                <div class="network-alert">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    <span>Send <strong>USDT</strong> via <strong>BNB Smart Chain (BEP20)</strong> ONLY. Any other network will result in permanent loss.</span>
                </div>
            </div>

            <button class="btn-order" onclick="submitToTracking()"><i class="fa-solid fa-check"></i> Submit & Track Order</button>
        </div>
    </div>

    <script>
        const database = {
            iphone: [
                { name: "iPhone 6 / 6 Plus", usd: "$40 – $55", sar: "150 – 210 SAR" },
                { name: "iPhone 6s / 6s Plus", usd: "$45 – $60", sar: "170 – 230 SAR" },
                { name: "iPhone 7 / 7 Plus", usd: "$55 – $75", sar: "210 – 280 SAR" },
                { name: "iPhone 8 / 8 Plus", usd: "$65 – $85", sar: "245 – 320 SAR" },
                { name: "iPhone X", usd: "$80 – $100", sar: "300 – 380 SAR" },
                { name: "iPhone XR / XS / XS Max", usd: "$90 – $115", sar: "340 – 430 SAR" },
                { name: "iPhone 11 / 11 Pro / 11 Pro Max", usd: "$105 – $135", sar: "395 – 510 SAR" },
                { name: "iPhone 12 / mini / Pro / Pro Max", usd: "$120 – $155", sar: "450 – 580 SAR" },
                { name: "iPhone 13 / mini / Pro / Pro Max", usd: "$135 – $170", sar: "510 – 640 SAR" },
                { name: "iPhone 14 / Plus / Pro / Pro Max", usd: "$150 – $190", sar: "560 – 715 SAR" },
                { name: "iPhone 15 / Plus / Pro / Pro Max", usd: "$170 – $220", sar: "640 – 825 SAR" },
                { name: "iPhone 16 / Plus / Pro / Pro Max", usd: "$200 – $250", sar: "750 – 940 SAR" },
                { name: "iPhone 17 / 17 Pro / 17 Pro Max", usd: "$240 – $300", sar: "900 – 1,125 SAR" }
            ],
            ipad: [
                { name: "iPad (5th to 7th Gen)", usd: "$35 – $50", sar: "130 – 190 SAR" },
                { name: "iPad (8th, 9th, 10th Gen)", usd: "$55 – $80", sar: "205 – 300 SAR" },
                { name: "iPad mini (mini 2, 3, 4)", usd: "$30 – $45", sar: "115 – 170 SAR" },
                { name: "iPad mini (mini 5, 6, 7)", usd: "$60 – $95", sar: "225 – 360 SAR" },
                { name: "iPad Air (Air 1, Air 2)", usd: "$30 – $45", sar: "115 – 170 SAR" },
                { name: "iPad Air (Air 3, Air 4)", usd: "$65 – $90", sar: "245 – 340 SAR" },
                { name: "iPad Air (Air 5 M1 / M2)", usd: "$95 – $140", sar: "360 – 525 SAR" },
                { name: "iPad Pro (Old: 9.7\", 10.5\", 12.9\")", usd: "$45 – $70", sar: "170 – 265 SAR" },
                { name: "iPad Pro (Gen 3 & 4 - A12X/Z)", usd: "$80 – $115", sar: "300 – 430 SAR" },
                { name: "iPad Pro M1 (11\" & 12.9\")", usd: "$110 – $160", sar: "415 – 600 SAR" },
                { name: "iPad Pro M2 (11\" & 12.9\")", usd: "$140 – $195", sar: "525 – 730 SAR" },
                { name: "iPad Pro M4 (Latest Pro Edition)", usd: "$190 – $260", sar: "715 – 975 SAR" }
            ],
            watch: [
                { name: "Apple Watch Series 1 / 2 / 3", usd: "$25 – $40", sar: "95 – 150 SAR" },
                { name: "Apple Watch Series 4 / 5", usd: "$40 – $55", sar: "150 – 210 SAR" },
                { name: "Apple Watch SE (Gen 1 / Gen 2)", usd: "$45 – $65", sar: "170 – 245 SAR" },
                { name: "Apple Watch Series 6 / 7", usd: "$55 – $75", sar: "210 – 285 SAR" },
                { name: "Apple Watch Series 8", usd: "$70 – $90", sar: "265 – 340 SAR" },
                { name: "Apple Watch Series 9", usd: "$85 – $110", sar: "320 – 415 SAR" },
                { name: "Apple Watch Series 10", usd: "$105 – $135", sar: "395 – 510 SAR" },
                { name: "Apple Watch Ultra (Gen 1 / Gen 2)", usd: "$95 – $130", sar: "360 – 490 SAR" }
            ],
            carrier: [
                { name: "Samsung Galaxy S21 / S22 Series", usd: "$25 – $40", sar: "95 – 150 SAR" },
                { name: "Samsung Galaxy S23 / S24 Series", usd: "$45 – $65", sar: "170 – 245 SAR" },
                { name: "Samsung Z Fold / Flip Series", usd: "$50 – $75", sar: "190 – 280 SAR" },
                { name: "Google Pixel All Models", usd: "$35 – $55", sar: "130 – 210 SAR" }
            ]
        };

        function loadCategory(cat) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            if(event) event.target.classList.add('active');
            const grid = document.getElementById("servicesGrid");
            grid.innerHTML = "";
            database[cat].forEach(item => {
                grid.innerHTML += `
                    <div class="service-card">
                        <div>
                            <span style="font-size:11px; padding:3px 8px; border-radius:12px; background:rgba(0,210,255,0.1); color:var(--accent-blue); font-weight:700;">1-48 HOURS EXPRESS</span>
                            <h3 style="margin-top:10px;">${item.name}</h3>
                            <div class="price-badge">
                                <div class="usd-val">${item.usd}</div>
                                <div class="sar-val">${item.sar}</div>
                            </div>
                        </div>
                        <button class="btn-order" onclick="openOrder('${item.name}', '${item.usd}')">Order Clean Unlock</button>
                    </div>
                `;
            });
        }
        loadCategory('iphone');

        let activeService = "";
        function openOrder(name, price) {
            activeService = name;
            document.getElementById("targetService").innerText = name;
            document.getElementById("targetPrice").innerText = price;
            document.getElementById("orderModal").style.display = "flex";
        }
        function closeModal() { document.getElementById("orderModal").style.display = "none"; }
        
        function copyWalletAddress() {
            const address = document.getElementById("targetWallet").innerText;
            navigator.clipboard.writeText(address).then(() => {
                alert("Wallet Address Copied Successfully:\n" + address);
            });
        }

        function submitToTracking() {
            const sn = document.getElementById("serialInput").value;
            if(!sn) { alert("Please provide IMEI or Serial!"); return; }
            window.location.href = `track.html?service=${encodeURIComponent(activeService)}&sn=${encodeURIComponent(sn)}`;
        }
    </script>
</body>
</html>
